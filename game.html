<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{margin:0;overflow:hidden;background:black}
#chatBox{position:absolute;top:10px;left:10px;width:200px;height:120px;background:#0008;overflow:auto}
#chatInput{position:absolute;bottom:10px;left:10px}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="chatBox"></div>
<input id="chatInput">

<script>

const supabase = window.supabase.createClient(
"https://pqbiyrdakqixepvzqtrx.supabase.co",
"PASTE_ANON_KEY_LO"
);

let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight);
let renderer=new THREE.WebGLRenderer({canvas:c});
renderer.setSize(innerWidth,innerHeight);

let player=new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshBasicMaterial({color:0x00ffcc})
);
scene.add(player);

// 🔥 UPDATE: load map
let map=localStorage.getItem("map");
if(map){
JSON.parse(map).forEach(d=>{
let cube=new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshBasicMaterial({color:d.color})
);
cube.position.set(d.x,d.y,d.z);
scene.add(cube);
});
}

// 🔥 UPDATE: load skin
async function loadSkin(){
let user=localStorage.getItem("username");
let {data}=await supabase.from("inventory").select("item_id").eq("username",user);
if(!data||data.length===0)return;

let {data:shopItem}=await supabase.from("shop").select("*").eq("id",data[0].item_id).single();
if(shopItem){player.material.color.set(shopItem.color);}
}
loadSkin();

// 💬 CHAT
chatInput.addEventListener("keydown",e=>{
if(e.key==="Enter"){
supabase.from("chat").insert({
user:localStorage.getItem("username"),
text:chatInput.value
});
chatInput.value="";
}
});

supabase.channel("chat")
.on("postgres_changes",{event:"INSERT",schema:"public",table:"chat"},p=>{
chatBox.innerHTML+=`<p>${p.new.user}: ${p.new.text}</p>`;
}).subscribe();

// LOOP
function loop(){
renderer.render(scene,camera);
requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
