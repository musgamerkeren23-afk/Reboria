<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{margin:0;overflow:hidden;background:black;}
#joyBase{position:absolute;bottom:30px;left:30px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%;}
#joyStick{position:absolute;width:60px;height:60px;background:red;border-radius:50%;left:30px;top:30px;}
#jumpBtn{position:absolute;bottom:50px;right:50px;width:80px;height:80px;background:red;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="joyBase"><div id="joyStick"></div></div>
<div id="jumpBtn">JUMP</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/parental.js"></script>
<script src="js/multiplayer.js"></script>

<script>
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight);
let renderer=new THREE.WebGLRenderer({canvas:c});
renderer.setSize(innerWidth,innerHeight);

let player=new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshBasicMaterial({color:0x00ffcc})
);
scene.add(player);
camera.position.z=5;

let moveX=0,moveZ=0;

joyBase.addEventListener("touchmove",e=>{
let t=e.touches[0];
let r=joyBase.getBoundingClientRect();
let x=t.clientX-r.left-60;
let y=t.clientY-r.top-60;

joyStick.style.left=(x+30)+"px";
joyStick.style.top=(y+30)+"px";

moveX=x/50;
moveZ=y/50;
});

joyBase.addEventListener("touchend",()=>{
moveX=0;moveZ=0;
joyStick.style.left="30px";
joyStick.style.top="30px";
});

let jumping=false,vy=0;

jumpBtn.addEventListener("touchstart",()=>{
if(!jumping){vy=0.25;jumping=true;}
});

function loop(){

player.position.x+=moveX*0.1;
player.position.z+=moveZ*0.1;

if(jumping){
player.position.y+=vy;
vy-=0.01;
if(player.position.y<=0){
player.position.y=0;
jumping=false;
}
}

camera.position.set(player.position.x,5,player.position.z+8);
camera.lookAt(player.position);

renderer.render(scene,camera);
requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
